name: CI

on:
  push:
    branches: [main]
    tags:
      - 'sdk-node-v*'
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  publish:
    if: startsWith(github.ref, 'refs/tags/sdk-node-v')
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install
      - run: pnpm run build
      - name: Publish with npm token
        if: ${{ vars.PUBLISH_WITH_NPM_TOKEN == 'true' }}
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish with OIDC provenance
        if: ${{ vars.PUBLISH_WITH_NPM_TOKEN != 'true' }}
        run: pnpm publish --no-git-checks --access public --provenance
