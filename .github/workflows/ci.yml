name: CI

on:
  push:
    branches: [main]
    tags:
      - 'sdk-node-v*'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm audit --audit-level=high
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  publish:
    if: startsWith(github.ref, 'refs/tags/sdk-node-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install
      - run: pnpm run build
      # Requires npm trusted publishing for Hebrah-inc/hebrah-sdk-node (OIDC).
      # Fallback: set NPM_TOKEN secret and add env NODE_AUTH_TOKEN to this step.
      - run: pnpm publish --no-git-checks --access public --provenance
